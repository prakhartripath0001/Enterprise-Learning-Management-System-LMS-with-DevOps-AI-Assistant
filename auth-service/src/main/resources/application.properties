spring.application.name=auth-service

# ── Server ─────────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8081}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ── DataSource ────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lms_auth_db}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER:lms_user}
spring.datasource.password=${DB_PASSWORD:lms_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRY_MS:900000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRY_MS:604800000}

# ── Security ──────────────────────────────────────────────────────────────────
security.bcrypt.strength=${BCRYPT_STRENGTH:12}
security.max-failed-login-attempts=${MAX_FAILED_ATTEMPTS:5}
security.account-lock-duration-minutes=${ACCOUNT_LOCK_DURATION:30}

# ── Email Verification Token ──────────────────────────────────────────────────
email.verification.expiry-hours=${EMAIL_VERIFY_EXPIRY_HOURS:24}
password.reset.expiry-minutes=${PASSWORD_RESET_EXPIRY_MINUTES:30}

# ── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,flyway
management.endpoint.health.show-details=when_authorized

# ── OpenAPI / Swagger ─────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.auth_service=DEBUG
logging.level.org.springframework.security=WARN
