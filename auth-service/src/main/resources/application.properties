spring.application.name=auth-service

# Port Configuration
server.port=${SERVER_PORT:8081}

# Database Connection
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lms_db}?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER:lms_user}
spring.datasource.password=${DB_PASSWORD:lms_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
