name: Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate-status:
    runs-on: ubuntu-latest
    steps:
      - name: Consolidated Gate Check
        run: |
          echo "Quality Gate active. All validations (Frontend and Backend) must pass to allow merge."
          echo "Linting: Strict"
          echo "Testing: Strict (Fail on failure)"
          echo "Coverage: Min 80% (Vitest/JaCoCo)"
          echo "Static Analysis: PMD, Checkstyle, SpotBugs"
