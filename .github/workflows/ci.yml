name: LMS CI Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build, Test, and Verify
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Set up JDK 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Code Style and Quality Check (TODO/FIXME Check)
      - name: Check for Forbidden Keywords (TODO/FIXME)
        run: |
          echo "Scanning code files for TODO/FIXME annotations..."
          FORBIDDEN=$(grep -rnE "TODO|FIXME" --include="*.java" --include="*.properties" --include="*.yml" auth-service/src/ || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "::error::Found forbidden TODO or FIXME comments in source files:"
            echo "$FORBIDDEN"
            exit 1
          fi
          echo "No TODO/FIXME comments found."

      # 4. Secret Scan (Custom Regex Check)
      - name: Scan Files for Hardcoded Secrets
        run: |
          echo "Scanning for potential passwords and keys..."
          SECRET_PATTERNS='(password|secret|private_key|token|api_key|credentials|jwt_secret)\s*=\s*["'\''][a-zA-Z0-9_\-\.\:\/\+\=\%]{8,}["'\'']'
          MATCHES=$(grep -rnE "$SECRET_PATTERNS" --include="*.java" --include="*.properties" --include="*.yml" --include="*.json" auth-service/src/ || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Potential hardcoded secrets detected:"
            echo "$MATCHES"
            exit 1
          fi
          echo "No hardcoded secrets detected."

      # 5. Gitleaks Security Scan
      - name: Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      # 6. Run Maven Clean & Test
      - name: Run Unit Tests
        run: |
          cd auth-service
          chmod +x mvnw
          ./mvnw clean test

      # 7. Run Maven Verify
      - name: Run Maven Verify & Package
        run: |
          cd auth-service
          ./mvnw verify -DskipTests

      # 8. Check Code Coverage Threshold (Jacoco)
      - name: Verify Code Coverage (Min 80%)
        run: |
          JACOCO_REPORT="auth-service/target/site/jacoco/jacoco.xml"
          MIN_COVERAGE=80
          if [ -f "$JACOCO_REPORT" ]; then
            echo "Parsing JaCoCo coverage report..."
            COVERED=$(grep -o -E 'type="LINE" missed="[0-9]+" covered="[0-9]+"' "$JACOCO_REPORT" | head -n 1 | sed -E 's/.*covered="([0-9]+)".*/\1/')
            MISSED=$(grep -o -E 'type="LINE" missed="[0-9]+" covered="[0-9]+"' "$JACOCO_REPORT" | head -n 1 | sed -E 's/.*missed="([0-9]+)".*/\1/')
            TOTAL=$((COVERED + MISSED))
            if [ "$TOTAL" -gt 0 ]; then
              ACTUAL=$(( (COVERED * 100) / TOTAL ))
              if [ "$ACTUAL" -lt "$MIN_COVERAGE" ]; then
                echo "::error::Code coverage ($ACTUAL%) is below the minimum required $MIN_COVERAGE%!"
                exit 1
              fi
              echo "Coverage check passed: $ACTUAL% (min required: $MIN_COVERAGE%)"
            fi
          else
            echo "::warning::JaCoCo XML report not found at $JACOCO_REPORT. Skipping coverage checks."
          fi
