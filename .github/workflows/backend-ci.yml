name: Backend CI Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'auth-service/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'auth-service/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Verify Build
        run: |
          cd auth-service
          ./mvnw clean verify -B
