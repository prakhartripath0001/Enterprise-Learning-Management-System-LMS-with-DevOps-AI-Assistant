name: Build & Test

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Build & Unit Tests ──────────────────────────────────────────────────────
  build-and-test:
    name: Build & Unit Tests (Java 21)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [ auth-service ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: ./mvnw clean compile -q

      - name: Run Unit Tests — ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: ./mvnw test

      - name: Upload Surefire Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/
          retention-days: 7

      - name: Run mvn verify (Coverage + Integration)
        working-directory: ${{ matrix.service }}
        run: ./mvnw verify

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ matrix.service }}
          path: ${{ matrix.service }}/target/site/jacoco/
          retention-days: 7

      - name: Package Production JAR
        working-directory: ${{ matrix.service }}
        run: ./mvnw package -DskipTests -q

      - name: Upload Production JAR
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.service }}
          path: ${{ matrix.service }}/target/*.jar
          retention-days: 7
