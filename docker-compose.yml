version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: lms-mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: lms_db
      MYSQL_USER: lms_user
      MYSQL_PASSWORD: lms_password
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: lms-auth-service
    restart: always
    ports:
      - '8081:8081'
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=lms_db
      - DB_USER=lms_user
      - DB_PASSWORD=lms_password
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:

