version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: lms-mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: lms_db
      MYSQL_USER: lms_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile.dev
    container_name: lms-auth-service
    restart: always
    ports:
      - '8081:8081'
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=lms_db
      - DB_USER=lms_user
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    volumes:
      - ./auth-service:/app
      - /app/target
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: lms-frontend
    restart: always
    ports:
      - '5173:5173'
    environment:
      - VITE_API_BASE_URL=http://localhost:8081/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - auth-service

volumes:
  mysql_data:
