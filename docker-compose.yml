version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: lms-mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: lms_db
      MYSQL_USER: lms_user
      MYSQL_PASSWORD: lms_password
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile.dev
    container_name: lms-auth-service
    restart: always
    ports:
      - '8081:8081'
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=lms_db
      - DB_USER=lms_user
      - DB_PASSWORD=lms_password
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    volumes:
      - ./auth-service:/app
      - /app/target
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: lms-frontend
    restart: always
    ports:
      - '5173:5173'
    environment:
      - VITE_API_BASE_URL=http://localhost:8081/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - auth-service

volumes:
  mysql_data:
